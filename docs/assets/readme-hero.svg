        <rect y="98" width="130" height="63" fill="#fff" stroke="#d9d6ce"/><rect x="10" y="109" width="92" height="7" fill="#1c1c1c"/><rect x="10" y="125" width="70" height="5" fill="#d9d6ce"/>
