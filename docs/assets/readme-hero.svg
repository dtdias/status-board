<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Status Board</title>
  <desc id="description">Editorial illustration of a weekly status board becoming a presentation deck.</desc>
